services:
  db:
    image: postgres:16-alpine
    container_name: dukteksi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dukteksi_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dukteksi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dukteksi-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dukteksi_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      JWT_SECRET: ${JWT_SECRET:-ganti_dengan_random_string_yang_sangat_rahasia_dan_panjang}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@dukteksi.mil.id}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-UbahPasswordIni123!}
      SEED_ADMIN_FULLNAME: ${SEED_ADMIN_FULLNAME:-Administrator Dukteksi}
    volumes:
      - uploads_data:/app/uploads
      - private_uploads_data:/app/private-uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dukteksi-frontend
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  private_uploads_data:
